<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Attrition Engine</title>
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden; background-color: #111;
            font-family: 'Courier New', Courier, monospace; color: white; user-select: none;
        }
        canvas { display: block; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; padding: 20px; box-sizing: border-box; }
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .stat-box { background: rgba(0,0,0,0.7); padding: 15px; border: 2px solid #444; border-radius: 8px; }
        h1, h2, h3 { margin: 0; padding: 0; }
        #timer { font-size: 2.5rem; color: #ffeb3b; }
        #phase-text { font-size: 1.2rem; color: #00e5ff; margin-top: 5px; max-width: 300px; }
        
        .crossover-container { width: 400px; text-align: center; }
        .bar-bg { width: 100%; height: 30px; background: #333; border: 2px solid #fff; border-radius: 15px; overflow: hidden; margin-top: 10px; position: relative;}
        .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #f44336, #4caf50); transition: width 0.1s; }
        .bar-text { position: absolute; top: 5px; width: 100%; text-align: center; font-weight: bold; z-index: 2; text-shadow: 1px 1px 2px black;}
        
        #support { color: #4caf50; font-size: 1.5rem; }
        
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); padding: 40px; border: 4px solid #fff;
            text-align: center; display: none; pointer-events: auto; border-radius: 10px; z-index: 10;
        }
        #game-over h1 { font-size: 3rem; margin-bottom: 20px; }
        #game-over p { font-size: 1.2rem; max-width: 500px; margin-bottom: 30px; line-height: 1.5; }
        
        #trivia-ui { border-color: #00e5ff; width: 600px; min-height: 350px; }
        #trivia-ui h2 { color: #ffeb3b; margin-bottom: 5px; font-size: 2rem; }
        .stakes { color: #aaa; font-size: 1rem; margin-bottom: 20px; font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 15px;}
        .stakes span.good { color: #4caf50; }
        .stakes span.bad { color: #f44336; }
        
        #question-text { font-size: 1.3rem; margin-bottom: 25px; line-height: 1.4; }
        .ans-btn {
            display: block; width: 100%; padding: 15px; margin-bottom: 10px; font-size: 1.1rem;
            background: #333; color: white; border: 2px solid #555; cursor: pointer; border-radius: 5px;
            text-align: left; transition: 0.2s;
        }
        .ans-btn:hover { background: #555; border-color: #00e5ff; }
        
        #trivia-result { display: none; font-size: 2.5rem; font-weight: bold; margin-top: 40px; text-transform: uppercase; line-height: 1.3; }
        #trivia-desc { font-size: 1.2rem; color: #fff; margin-top: 15px; }

        button.action-btn {
            padding: 15px 30px; font-size: 1.2rem; font-family: inherit; font-weight: bold;
            background: #ffeb3b; color: #000; border: none; cursor: pointer; border-radius: 5px;
            transition: transform 0.1s;
        }
        button.action-btn:active { transform: scale(0.95); }

        /* Dev Menu Specific Styles */
        #dev-menu { border-color: #e040fb; width: 400px; }
        #dev-menu h2 { color: #e040fb; margin-bottom: 20px; font-size: 2rem; }
        #dev-menu .ans-btn:hover { border-color: #e040fb; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <div class="hud-top">
        <div class="stat-box">
            <div id="timer">2:00</div>
            <div id="phase-text">Phase 1: Stop the Domino Theory. Prevent the spread.</div>
        </div>
        
        <div class="crossover-container stat-box">
            <h3>The "Crossover Point"</h3>
            <div class="bar-bg">
                <div class="bar-fill" id="crossover-fill"></div>
                <div class="bar-text">Casualties vs Replacement Rate</div>
            </div>
        </div>

        <div class="stat-box">
            <div id="support">Public Support: 100%</div>
            <div style="font-size: 0.9rem; margin-top:5px; color:#aaa;">Don't let them breach!</div>
        </div>
    </div>
</div>

<div id="trivia-ui" class="modal">
    <h2>INTEL DROP</h2>
    <div class="stakes">Reward: <span class="good">360° Nova Blast</span> | Penalty: <span class="bad">-30% Public Support</span></div>
    
    <div id="question-text">Question goes here?</div>
    <button class="ans-btn" onclick="answerTrivia(0)" id="ans0">Answer 1</button>
    <button class="ans-btn" onclick="answerTrivia(1)" id="ans1">Answer 2</button>
    <button class="ans-btn" onclick="answerTrivia(2)" id="ans2">Answer 3</button>

    <div id="trivia-result"></div>
    <div id="trivia-desc"></div>
</div>

<div id="game-over" class="modal">
    <h1 id="end-title">GAME OVER</h1>
    <p id="end-desc">Text goes here</p>
    <button class="action-btn" onclick="location.reload()">Re-Deploy</button>
</div>

<div id="dev-menu" class="modal">
    <h2>DEV MENU</h2>
    <button class="ans-btn" onclick="devGodGuns()">Enable God Guns</button>
    <button class="ans-btn" onclick="devMaxSupport()">Max Public Support</button>
    <button class="ans-btn" onclick="devTriggerCrossover()">Trigger Crossover (Win)</button>
    <button class="action-btn" style="background:#e040fb; color:white; margin-top:15px; width:100%;" onclick="toggleDevMenu()">Resume Game</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let keys = {};
    let mouse = { x: canvas.width/2, y: canvas.height/2, isDown: false };
    
    let isGameOver = false;
    let isPaused = false;
    let timeRemaining = 120;
    let publicSupport = 100;
    let crossoverPoint = 0; 
    let phase = 1;
    let enemySpawnRate = 25; 
    let frameCount = 0;

    // Secret code tracker
    let secretCode = "";
    let devMenuOpen = false;

    const questions = [
        { q: "Who served as the U.S. Secretary of Defense and was known as the chief architect of the Vietnam War?", answers: ["Dean Rusk", "Robert McNamara", "William Westmoreland"], correct: 1 },
        { q: "What is the theoretical 'Crossover Point'?", answers: ["When the U.S. drops below 50% public support.", "When enemy forces seize and hold territory.", "When enemy casualties exceed their ability to replace fallen soldiers."], correct: 2 },
        { q: "Instead of holding territory, General Westmoreland's strategy of attrition aimed to do what?", answers: ["Wear down the enemy through continuous losses.", "Limit Soviet influence in neighboring regions.", "Provide aid to the Army of the Republic of Vietnam."], correct: 0 },
        { q: "What was the 'Domino Theory'?", answers: ["The strategy to bomb targets in a straight line.", "The idea that if one country fell to communism, surrounding countries would also fall.", "The plan to replace U.S. troops with South Vietnamese troops."], correct: 1 },
        { q: "Which of the following was a primary reason the U.S. went to war in Vietnam?", answers: ["The Gulf of Tonkin incident", "To overthrow the Soviet Union directly", "To seize control of local agriculture"], correct: 0 },
        { q: "Who was the Army of the Republic of Vietnam (ARVN)?", answers: ["The North Vietnamese regular army", "The fighting force of the South Vietnamese people", "A U.S. special operations group"], correct: 1 }
    ];
    let currentQuestionObj = null;
    let crate = null; 

    const player = { x: canvas.width / 2, y: canvas.height / 2, radius: 20, speed: 5, color: '#00e5ff', cooldown: 0, fireRate: 10 };
    const bullets = [];
    const enemies = [];
    const particles = [];

    window.addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;

        // DEV MENU LOGIC
        secretCode += e.key;
        if (secretCode.length > 4) {
            secretCode = secretCode.substring(1); // Keep only the last 4 key presses
        }
        if (secretCode === "4175") {
            toggleDevMenu();
            secretCode = ""; // Reset code after triggering
        }
    });

    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mousedown', () => mouse.isDown = true);
    window.addEventListener('mouseup', () => mouse.isDown = false);
    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

    // DEV MENU FUNCTIONS
    window.toggleDevMenu = function() {
        if (isGameOver) return; // Don't open if game is already over
        devMenuOpen = !devMenuOpen;
        isPaused = devMenuOpen; // Pause game logic
        document.getElementById('dev-menu').style.display = devMenuOpen ? 'block' : 'none';
    };

    window.devGodGuns = function() {
        player.fireRate = 1; // Machine gun speed
        player.speed = 10;   // Zoom zoom
        toggleDevMenu();
    };

    window.devMaxSupport = function() {
        publicSupport = 999;
        updateUI();
        toggleDevMenu();
    };

    window.devTriggerCrossover = function() {
        crossoverPoint = 100;
        updateUI();
        toggleDevMenu();
        // The game loop will catch this and trigger the win screen immediately
    };

    setInterval(() => {
        if(isGameOver || isPaused) return;
        timeRemaining--;
        updateUI();
        
        let replacementRate = phase === 3 ? 8 : 4; 
        crossoverPoint = Math.max(0, crossoverPoint - replacementRate);

        if (timeRemaining === 80) {
            phase = 2;
            document.getElementById('phase-text').innerText = "Phase 2: Westmoreland's Attrition. Troops scaling to 500,000.";
            player.fireRate = 5; 
            enemySpawnRate = 8; 
        } else if (timeRemaining === 40) {
            phase = 3;
            document.getElementById('phase-text').innerText = "Phase 3: The Tet Offensive! They are accepting massive casualties!";
            enemySpawnRate = 2; 
            document.getElementById('phase-text').style.color = "#f44336";
        }

        if ([100, 80, 60, 40, 20].includes(timeRemaining)) spawnCrate();

        if (timeRemaining <= 0) endGame("Costly Stalemate", "Time expired. The strategy of attrition resulted in a costly stalemate. The U.S. greatly lost support for the war.");
    }, 1000);

    function updateUI() {
        let m = Math.floor(timeRemaining / 60); let s = timeRemaining % 60;
        document.getElementById('timer').innerText = `${m}:${s.toString().padStart(2, '0')}`;
        document.getElementById('support').innerText = `Public Support: ${Math.max(0, Math.floor(publicSupport))}%`;
        document.getElementById('crossover-fill').style.width = `${Math.min(100, crossoverPoint)}%`;
        let supportEl = document.getElementById('support');
        supportEl.style.color = publicSupport < 30 ? '#f44336' : '#4caf50';
    }

    function shoot() {
        if (player.cooldown <= 0) {
            let angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            bullets.push({ x: player.x, y: player.y, radius: 4, speed: 15, dx: Math.cos(angle), dy: Math.sin(angle), life: 100 });
            player.cooldown = player.fireRate;
        }
    }

    function spawnEnemy() {
        let side = Math.floor(Math.random() * 4); let ex, ey;
        if (side === 0) { ex = Math.random() * canvas.width; ey = -30; } 
        else if (side === 1) { ex = canvas.width + 30; ey = Math.random() * canvas.height; } 
        else if (side === 2) { ex = Math.random() * canvas.width; ey = canvas.height + 30; } 
        else { ex = -30; ey = Math.random() * canvas.height; }
        
        let hpVal = 1;
        if (phase === 2) hpVal = 2;
        if (phase === 3) hpVal = 4;

        enemies.push({ x: ex, y: ey, radius: 12, speed: Math.random() * 2 + 1.8, hp: hpVal });
    }

    function spawnCrate() {
        crate = { x: Math.random() * (canvas.width - 200) + 100, y: Math.random() * (canvas.height - 200) + 100, radius: 20 };
    }

    function triggerTrivia() {
        isPaused = true;
        currentQuestionObj = questions[Math.floor(Math.random() * questions.length)];
        
        document.getElementById('question-text').style.display = 'block';
        document.getElementById('ans0').style.display = 'block';
        document.getElementById('ans1').style.display = 'block';
        document.getElementById('ans2').style.display = 'block';
        document.getElementById('trivia-result').style.display = 'none';
        document.getElementById('trivia-desc').style.display = 'none';

        document.getElementById('question-text').innerText = currentQuestionObj.q;
        document.getElementById('ans0').innerText = currentQuestionObj.answers[0];
        document.getElementById('ans1').innerText = currentQuestionObj.answers[1];
        document.getElementById('ans2').innerText = currentQuestionObj.answers[2];
        document.getElementById('trivia-ui').style.display = 'block';
    }

    window.answerTrivia = function(index) {
        document.getElementById('question-text').style.display = 'none';
        document.getElementById('ans0').style.display = 'none';
        document.getElementById('ans1').style.display = 'none';
        document.getElementById('ans2').style.display = 'none';

        let resultEl = document.getElementById('trivia-result');
        let descEl = document.getElementById('trivia-desc');
        resultEl.style.display = 'block';
        descEl.style.display = 'block';

        let isCorrect = (index === currentQuestionObj.correct);

        if (isCorrect) {
            resultEl.style.color = '#4caf50';
            resultEl.innerText = "CORRECT!";
            descEl.innerText = "Deploying 360° Superior Firepower!";
        } else {
            resultEl.style.color = '#f44336';
            resultEl.innerText = "WRONG!";
            descEl.innerText = "Bad Intel! You lost 30% Public Support.";
        }

        setTimeout(() => {
            document.getElementById('trivia-ui').style.display = 'none';
            isPaused = false;
            
            if (isCorrect) {
                for(let i=0; i < 36; i++) {
                    let angle = i * 10 * (Math.PI/180);
                    bullets.push({ x: player.x, y: player.y, radius: 8, speed: 10, dx: Math.cos(angle), dy: Math.sin(angle), life: 200 });
                }
                crossoverPoint += 10; 
            } else {
                publicSupport -= 30; 
                updateUI();
                createExplosion(player.x, player.y, '#f44336');
                if (publicSupport <= 0) endGame("Public Support Collapsed", "Bad intel and massive casualties caused the U.S. to greatly lose support for the war.");
            }
            crate = null;
        }, 2000);
    };

    function createExplosion(x, y, color) {
        for (let i = 0; i < 15; i++) {
            particles.push({ x: x, y: y, radius: Math.random() * 3 + 1, dx: (Math.random() - 0.5) * 8, dy: (Math.random() - 0.5) * 8, color: color, life: 30 });
        }
    }

    function gameLoop() {
        if (isGameOver) return;

        // Catch win condition natively so dev menu trigger works instantly
        if (crossoverPoint >= 100) {
            endGame("Pyrrhic Victory", "You reached the Crossover Point, but at what cost? The massive amount of casualties caused the public to condemn the U.S. and greatly lose support for the war.");
            return;
        }

        if (!isPaused) {
            ctx.fillStyle = 'rgba(17, 17, 17, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            frameCount++;

            if (keys['w'] && player.y > player.radius) player.y -= player.speed;
            if (keys['s'] && player.y < canvas.height - player.radius) player.y += player.speed;
            if (keys['a'] && player.x > player.radius) player.x -= player.speed;
            if (keys['d'] && player.x < canvas.width - player.radius) player.x += player.speed;

            if (mouse.isDown) shoot();
            if (player.cooldown > 0) player.cooldown--;

            if (crate) {
                ctx.fillStyle = '#ffeb3b';
                ctx.fillRect(crate.x - 15, crate.y - 15, 30, 30);
                ctx.fillStyle = '#000';
                ctx.fillText("?", crate.x - 4, crate.y + 5);
                
                if (Math.hypot(player.x - crate.x, player.y - crate.y) < player.radius + 15) {
                    triggerTrivia();
                }
            }

            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color; ctx.fill(); ctx.closePath();

            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.lineTo(player.x + Math.cos(Math.atan2(mouse.y - player.y, mouse.x - player.x)) * 40, 
                       player.y + Math.sin(Math.atan2(mouse.y - player.y, mouse.x - player.x)) * 40);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
            ctx.lineWidth = 2;
            ctx.stroke();

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.dx * b.speed; b.y += b.dy * b.speed; b.life--;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffeb3b'; ctx.fill();
                if (b.life <= 0) bullets.splice(i, 1);
            }

            if (frameCount % enemySpawnRate === 0) spawnEnemy();

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                let angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed; e.y += Math.sin(angle) * e.speed;

                ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#f44336'; ctx.fill();

                let distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
                if (distToPlayer - player.radius - e.radius < 0) {
                    publicSupport -= 3.5; 
                    createExplosion(e.x, e.y, '#f44336');
                    enemies.splice(i, 1); updateUI();
                    if (publicSupport <= 0) endGame("Public Support Collapsed", "The massive amount of casualties caused the U.S. to greatly lose support for the war.");
                    continue;
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    let distToBullet = Math.hypot(b.x - e.x, b.y - e.y);
                    if (distToBullet - e.radius - b.radius < 0) {
                        e.hp--; bullets.splice(j, 1);
                        if (e.hp <= 0) {
                            createExplosion(e.x, e.y, '#ff9800');
                            crossoverPoint += 0.5; 
                            enemies.splice(i, 1); updateUI();
                            break;
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx; p.y += p.dy; p.life--;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color; ctx.globalAlpha = p.life / 30; ctx.fill(); ctx.globalAlpha = 1.0;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }
        requestAnimationFrame(gameLoop);
    }

    function endGame(title, desc) {
        isGameOver = true;
        document.getElementById('game-over').style.display = 'block';
        document.getElementById('end-title').innerText = title;
        document.getElementById('end-desc').innerText = desc;
        
        if(title === "Pyrrhic Victory") {
            document.getElementById('end-title').style.color = "#ffeb3b"; 
        } else {
            document.getElementById('end-title').style.color = "#f44336"; 
        }
    }

    gameLoop();
</script>
</body>
</html>
